# Community relays: volunteers who run shortcut-relay for everyone.
#
# Shortcut fetches this file from the repo and uses it only when the signature
# checks out against the key built into the app, so nobody can slip a relay in
# on the way. To add yours, set one up with relay/cloud-init.yaml and open a
# pull request. Maintainers re-sign the list after a week of good uptime.
#
# A relay forwards only UDP, only to the one public address each session
# registered, at up to 1 Mbit/s a session. It can't carry web traffic and
# can't be used as an open proxy. That's what makes it safe to run one.

[list]
version = 14
updated = 2026-10-28
key = "shortcut-relays-2026"   # which of the app's built-in keys signed it
signature = "ed25519:79Ill0a0HV+b17YqNG50ryJLIEbH0O6bD3GClFBihvlGV5ePOXw0FLSvKvgX2gVjs+PEArVc9kL/JEaxgCwydw=="   # over the relay array below, as written

